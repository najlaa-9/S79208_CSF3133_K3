<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="lab6styleA.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name and click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <!-- Player Name -->
    <section>
        <label>Your Name:</label>
        <input type="text" id="playerName">
        <button onclick="startGame()">Start Game</button>
    </section>

    <!-- Game Buttons -->
    <section id="gameArea">
        <button onclick="playRound('rock')">Rock</button>
        <button onclick="playRound('paper')">Paper</button>
        <button onclick="playRound('scissors')">Scissors</button>
    </section>

    <!-- Images -->
    <section class="images">
        <div>
            <h3>You</h3>
            <img id="playerImg" src="rock.png" alt="Player Choice">
        </div>

        <div>
            <h3>Computer</h3>
            <img id="computerImg" src="rock.png" alt="Computer Choice">
        </div>
    </section>

    <!-- Result -->
    <h2 id="result">Result will be shown here</h2>

    <!-- Scoreboard -->
    <section>
        <p id="score">
            Wins: <span id="wins">0</span> |
            Losses: <span id="losses">0</span> |
            Draws: <span id="draws">0</span>
        </p>
    </section>

    <!-- History Table -->
    <section>
        <h2>History</h2>
        <table id="history">
            <tr>
                <th>Round</th>
                <th>You</th>
                <th>Computer</th>
                <th>Result</th>
            </tr>
        </table>
    </section>

    <!-- Summary & Reset -->
    <section>
        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>
    </section>

    <p id="startTime"></p>

    <!-- Footer -->
    <footer>
        &copy; 2024 Computer Science Club
    </footer>

    <script src="game.js"></script>

</body>
</html>
